<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAL | Media Archive Log</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234299e1'/><path d='M12 4L4 8l8 4 8-4-8-4zM4 14l8 4 8-4M4 11l8 4 8-4' stroke='%23ffffff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-body: #0d0f12;
            --bg-glow: radial-gradient(circle at 50% 10%, rgba(66, 153, 225, 0.08), transparent 60%);
            --bg-container: rgba(26, 30, 36, 0.88);
            --bg-card: rgba(35, 41, 50, 0.7);
            --bg-card-hover: rgba(48, 56, 68, 0.9);
            --bg-card-active: rgba(44, 62, 80, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --tag-bg: rgba(66, 153, 225, 0.15);
            --tag-text: #63b3ed;
            --star-color: #f6ad55;
            --accent-border: #4299e1;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            
            --series-bg: rgba(159, 122, 234, 0.18);
            --series-text: #b794f4;
            --series-border: rgba(159, 122, 234, 0.35);

            --shape-fill-1: rgba(66, 153, 225, 0.22);
            --shape-fill-2: rgba(159, 122, 234, 0.2);
            --shape-fill-3: rgba(237, 100, 166, 0.18);
            --shape-stroke-1: rgba(66, 153, 225, 0.45);
            --shape-stroke-2: rgba(159, 122, 234, 0.45);
        }

        body.light-theme {
            --bg-body: #f3f4f6;
            --bg-glow: radial-gradient(circle at 50% 10%, rgba(28, 126, 214, 0.08), transparent 60%);
            --bg-container: rgba(255, 255, 255, 0.92);
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fa;
            --bg-card-active: #e7f5ff;
            --border-color: #e5e7eb;
            --border-light: #d1d5db;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --tag-bg: #e7f5ff;
            --tag-text: #1c7ed6;
            --star-color: #f59f00;
            --accent-border: #1c7ed6;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            
            --series-bg: #f3e8ff;
            --series-text: #7e22ce;
            --series-border: #d8b4fe;

            --shape-fill-1: rgba(28, 126, 214, 0.28);
            --shape-fill-2: rgba(121, 80, 242, 0.24);
            --shape-fill-3: rgba(230, 73, 128, 0.24);
            --shape-stroke-1: rgba(28, 126, 214, 0.6);
            --shape-stroke-2: rgba(121, 80, 242, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body { height: 100%; overflow: hidden; }
        body { 
            background-color: var(--bg-body); 
            background-image: var(--bg-glow);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            transition: background 0.3s ease, color 0.3s ease; 
            position: relative;
        }

        /* 배경 부유 도형 */
        #bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
        }

        #bg-shapes.active {
            opacity: 1;
            visibility: visible;
        }

        .shape {
            position: absolute;
            animation: waterDrift 28s infinite alternate ease-in-out;
        }

        .shape-1 { width: 90px; height: 90px; border: 3.5px solid var(--shape-stroke-1); border-radius: 50%; top: 12%; left: 8%; animation-duration: 24s; }
        .shape-2 { width: 65px; height: 65px; background: var(--shape-fill-2); border: 2.5px solid var(--shape-stroke-2); border-radius: 12px; bottom: 18%; left: 10%; animation-duration: 32s; animation-delay: -5s; }
        .shape-3 { width: 110px; height: 110px; border: 3.5px dashed var(--shape-stroke-2); border-radius: 50%; top: 18%; right: 10%; animation-duration: 36s; animation-delay: -10s; }
        .shape-4 { width: 80px; height: 80px; border: 3.5px solid var(--shape-stroke-1); border-radius: 16px; bottom: 14%; right: 12%; animation-duration: 26s; animation-delay: -15s; }
        .shape-5 { width: 45px; height: 45px; background: var(--shape-fill-3); border-radius: 50%; top: 48%; left: 4%; animation-duration: 20s; animation-delay: -8s; }
        .shape-6 { width: 55px; height: 55px; background: var(--shape-fill-1); border-radius: 10px; top: 55%; right: 6%; animation-duration: 30s; animation-delay: -18s; }
        .shape-7 { width: 35px; height: 35px; border: 2.5px solid var(--shape-stroke-1); border-radius: 50%; top: 8%; left: 45%; animation-duration: 22s; animation-delay: -12s; }
        .shape-8 { width: 40px; height: 40px; background: var(--shape-fill-2); border-radius: 8px; bottom: 6%; left: 42%; animation-duration: 34s; animation-delay: -7s; }

        @keyframes waterDrift {
            0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
            25% { transform: translate(25px, -35px) rotate(45deg) scale(1.05); }
            50% { transform: translate(-20px, -60px) rotate(110deg) scale(0.95); }
            75% { transform: translate(30px, -20px) rotate(190deg) scale(1.03); }
            100% { transform: translate(-15px, 25px) rotate(270deg) scale(0.98); }
        }
        
        /* 메인 컨테이너 */
        .container { 
            width: 100%; 
            max-width: 1200px; 
            height: calc(100vh - 40px); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 24px; 
            background: var(--bg-container); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-card); 
            display: flex; 
            flex-direction: column; 
            position: relative;
            z-index: 1;
            transition: max-width 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease, border-color 0.3s ease; 
        }
        .container.single-mode { max-width: 820px; }

        /* 상단 브랜딩 로고 & 검색 */
        .top-bar { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; flex-shrink: 0; }
        
        .brand-wrap { display: flex; align-items: center; gap: 8px; }
        .brand-logo { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 14px; 
            font-weight: 800; 
            color: #fff; 
            background: linear-gradient(135deg, #4299e1 0%, #667eea 100%); 
            padding: 6px 12px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(66, 153, 225, 0.3);
            letter-spacing: 0.5px;
            user-select: none;
        }
        .brand-logo svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* POSTS 뱃지 (부드러운 테마 전환 트랜지션 추가) */
        .logo-badge { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-sub); 
            background: var(--bg-card); 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            white-space: nowrap; 
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }
        
        .btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .btn:hover { background: var(--bg-card-hover); border-color: var(--border-light); transform: translateY(-1px); }
        .btn:active { transform: scale(0.95); }
        .btn.active-effect { background: var(--tag-bg); color: var(--tag-text); border-color: var(--accent-border); }
        .btn.rotating { animation: spin 0.6s ease-in-out; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 검색창 + ✕ 초기화 버튼 */
        .search-box { flex: 1; display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--bg-card); transition: all 0.2s ease; position: relative; }
        .search-box:focus-within { border-color: var(--accent-border); box-shadow: 0 0 0 2px var(--tag-bg); }
        .search-box input { width: 100%; padding: 10px 32px 10px 14px; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 14px; }
        .search-clear-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 14px; display: none; line-height: 1; padding: 2px; }
        .search-clear-btn:hover { color: var(--text-main); }
        
        /* 레이아웃 구조 */
        .main-layout { display: flex; gap: 24px; flex: 1; min-height: 0; }
        
        /* 목록 영역 */
        .list-pane { width: 100%; display: flex; flex-direction: column; min-height: 0; transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .container:not(.single-mode) .list-pane { width: 380px; flex-shrink: 0; border-right: 1px solid var(--border-color); padding-right: 20px; }

        /* 컨트롤 및 태그 영역 */
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; flex-shrink: 0; }
        .controls-header { display: flex; justify-content: space-between; align-items: center; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 80px; overflow-y: auto; padding-right: 2px; }
        .tag-list::-webkit-scrollbar { width: 4px; }
        .tag-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .tag-filter-btn { background: var(--bg-card); color: var(--text-sub); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: 500; transition: all 0.2s ease; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
        .tag-filter-btn:hover { border-color: var(--accent-border); color: var(--text-main); }
        .tag-filter-btn.active { background: var(--tag-bg); color: var(--tag-text); border-color: var(--tag-text); font-weight: 600; }
        .tag-count { font-size: 10px; opacity: 0.75; }

        .sort-select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer; }
        
        .list-container { flex: 1; overflow-y: auto; padding-right: 6px; min-height: 0; }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* 목록 아이템 */
        .list-item { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            margin-bottom: 10px; 
            background: var(--bg-card); 
            cursor: pointer; 
            transition: all 0.2s ease; 
            animation: listItemFade 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes listItemFade {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .list-item:hover { background: var(--bg-card-hover); border-color: var(--tag-text); transform: translateY(-1px); }
        .list-item.active { background: var(--bg-card-active); border-color: var(--accent-border); border-left: 4px solid var(--accent-border); transform: translateX(3px); }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .item-badges { display: flex; align-items: center; gap: 6px; }
        .item-meta { display: flex; align-items: center; gap: 8px; }
        .item-date { font-size: 11px; color: var(--text-sub); }
        .item-stars { color: var(--star-color); font-size: 13px; letter-spacing: 1px; }
        .item-tag { background: var(--tag-bg); color: var(--tag-text); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        
        .series-badge { background: var(--series-bg); color: var(--series-text); border: 1px solid var(--series-border); padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }

        /* 상세 영역 */
        .detail-pane { flex: 1; overflow-y: auto; padding-left: 4px; padding-right: 6px; display: none; min-height: 0; }
        .detail-pane::-webkit-scrollbar { width: 6px; }
        .detail-pane::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .detail-content-wrap { animation: postFadeSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes postFadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .detail-header-wrap { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
        .detail-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .detail-title { font-size: 24px; font-weight: bold; color: var(--text-main); }
        .detail-meta { display: flex; align-items: center; gap: 12px; }
        .detail-stars { color: var(--star-color); font-size: 18px; letter-spacing: 2px; }
        .detail-date { font-size: 13px; color: var(--text-sub); }
        
        .detail-header-btns { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .icon-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .icon-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-border); transform: scale(1.05); }

        /* 마크다운 본문 */
        .detail-content { font-size: 15px; line-height: 1.8; margin-bottom: 24px; color: var(--text-main); word-break: break-word; }
        .detail-content p { margin-bottom: 12px; }
        .detail-content h1, .detail-content h2, .detail-content h3 { margin-top: 18px; margin-bottom: 8px; color: var(--text-main); }
        .detail-content ul, .detail-content ol { padding-left: 20px; margin-bottom: 12px; }
        .detail-content li { margin-bottom: 4px; }
        .detail-content a { color: var(--accent-border); text-decoration: underline; }
        .detail-content blockquote { border-left: 4px solid var(--accent-border); padding-left: 12px; color: var(--text-sub); margin: 12px 0; background: var(--bg-card); padding: 8px 12px; border-radius: 4px; }
        .detail-content code { background: var(--bg-card); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

        /* 미디어 & 이미지 */
        .media-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
        
        .image-card { 
            position: relative; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            overflow: hidden; 
            background: rgba(0,0,0,0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 180px; 
            max-height: 380px; 
            padding: 8px; 
            text-decoration: none;
        }
        .image-card.has-link { cursor: pointer; transition: all 0.2s ease; }
        .image-card.has-link:hover { transform: translateY(-3px); border-color: var(--accent-border); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        
        .image-card img { 
            max-width: 100%; 
            max-height: 360px; 
            width: auto; 
            height: auto; 
            object-fit: contain; 
            border-radius: 6px; 
            display: block; 
        }
        
        .link-badge { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(0, 0, 0, 0.75); 
            color: #fff; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            backdrop-filter: blur(4px); 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .image-card.has-link:hover .link-badge { background: var(--accent-border); }

        .youtube-box { border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; background: var(--bg-card); }
        .youtube-box iframe { width: 100%; height: 380px; border: none; display: block; }

        /* 하단 시리즈 모아보기 섹션 */
        .series-section { margin-top: 30px; padding: 18px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--series-border); }
        .series-header { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--series-text); margin-bottom: 12px; }
        .series-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .series-item-btn { background: var(--bg-container); color: var(--text-main); border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .series-item-btn:hover { border-color: var(--series-text); transform: translateY(-1px); }
        .series-item-btn.current { background: var(--series-bg); color: var(--series-text); border-color: var(--series-border); font-weight: 700; cursor: default; }

        /* 토스트 알림창 */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: rgba(18, 22, 28, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--accent-border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            html, body { overflow: auto; height: auto; }
            .container { padding: 14px; height: auto; min-height: 90vh; }
            .container:not(.single-mode) .list-pane { display: none; }
            .list-container { max-height: 60vh; }
            .detail-pane { padding-left: 0; max-height: none; }
            .youtube-box iframe { height: 230px; }
        }
    </style>
</head>
<body>

<div id="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
    <div class="shape shape-6"></div>
    <div class="shape shape-7"></div>
    <div class="shape shape-8"></div>
</div>

<div class="container single-mode" id="main-container">
    <div class="top-bar">
        <div class="brand-wrap">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                MAL
            </div>
            <div class="logo-badge" id="total-badge">0 POSTS</div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="게시물 검색 (제목, 태그, 본문)..." oninput="handleSearchInput()">
            <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" title="검색어 지우기">✕</button>
        </div>

        <button class="btn" id="random-btn" onclick="openRandomPost()" title="무작위 추천">🎲</button>
        <button class="btn" id="effect-btn" onclick="toggleShapesEffect()" title="배경 애니메이션 효과 켜기/끄기">✨</button>
        <button class="btn" id="refresh-btn" onclick="forceReloadData()" title="데이터 즉시 새로고침">🔄</button>
        <button class="btn" id="theme-btn" onclick="toggleTheme()" title="테마 변경">🌙</button>
    </div>

    <div class="main-layout">
        <div class="list-pane" id="list-pane">
            <div class="controls">
                <div class="controls-header">
                    <span style="font-size: 11px; font-weight: 600; color: var(--text-sub);">TAGS</span>
                    <select class="sort-select" id="sort-select" onchange="applyFilters()">
                        <option value="latest">최신 등록순</option>
                        <option value="oldest">오래된 순</option>
                        <option value="rating-desc">별점 높은순</option>
                        <option value="rating-asc">별점 낮은순</option>
                    </select>
                </div>
                <div class="tag-list" id="tag-filters"></div>
            </div>
            <div class="list-container" id="post-list">
                <div style="text-align: center; color: var(--text-sub); padding: 30px 0;">데이터를 불러오는 중...</div>
            </div>
        </div>

        <div class="detail-pane" id="detail-pane">
            <div class="detail-content-wrap" id="detail-anim-wrap">
                <div class="detail-header-wrap">
                    <div>
                        <div class="detail-title-row">
                            <div class="detail-title" id="d-title"></div>
                        </div>
                        <div class="detail-meta">
                            <span class="detail-stars" id="d-stars"></span>
                            <span class="item-tag" id="d-tag"></span>
                            <span class="detail-date" id="d-date"></span>
                        </div>
                    </div>
                    <div class="detail-header-btns">
                        <button class="icon-btn" onclick="copyPostLink()" title="게시물 링크 복사">🔗</button>
                        <button class="icon-btn" onclick="closeDetail()" title="게시물 닫기">&lt;</button>
                    </div>
                </div>
                
                <div class="media-container" id="d-media-container" style="display: none;"></div>
                <div class="detail-content" id="d-content"></div>

                <div class="series-section" id="d-series-section" style="display: none;">
                    <div class="series-header">
                        <span>📚</span> <span id="d-series-title">시리즈 연계작</span>
                    </div>
                    <div class="series-list" id="d-series-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast">링크가 클립보드에 복사되었습니다!</div>

<script>
    const SHEET_BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSt83M_zED5TrMWMr8Rh7JaTkqgdqlfWu9WgUXR6uLu2VIdf5Me6Hfcwo8m9PHwBbhGVNgaeciKYA2c/pub?output=csv";

    let allPosts = [];
    let selectedTag = 'ALL';
    let currentSelectedId = null;

    // 마크다운 외부 링크 항상 새 탭 열기 렌더러 커스텀
    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
        return `<a target="_blank" rel="noopener noreferrer" href="${href}" title="${title || ''}">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer });

    function renderStars(ratingNum) {
        const rating = parseInt(ratingNum, 10) || 0;
        const valid = Math.max(0, Math.min(5, rating));
        return '★'.repeat(valid) + '☆'.repeat(5 - valid);
    }

    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('theme-btn').innerText = '☀️';
        }
    }

    function toggleShapesEffect() {
        const shapesElem = document.getElementById('bg-shapes');
        const btn = document.getElementById('effect-btn');
        const isCurrentlyActive = shapesElem.classList.contains('active');

        if (isCurrentlyActive) {
            shapesElem.classList.remove('active');
            btn.classList.remove('active-effect');
            localStorage.setItem('bg_effect', 'off');
        } else {
            shapesElem.classList.add('active');
            btn.classList.add('active-effect');
            localStorage.setItem('bg_effect', 'on');
        }
    }

    function initShapesEffect() {
        const savedEffect = localStorage.getItem('bg_effect');
        const shapesElem = document.getElementById('bg-shapes');
        const btn = document.getElementById('effect-btn');

        if (savedEffect === 'on') {
            shapesElem.classList.add('active');
            btn.classList.add('active-effect');
        } else {
            shapesElem.classList.remove('active');
            btn.classList.remove('active-effect');
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function copyPostLink() {
        if (!currentSelectedId) return;
        const shareUrl = window.location.origin + window.location.pathname + '#' + currentSelectedId;
        navigator.clipboard.writeText(shareUrl).then(() => {
            showToast('🔗 게시물 링크가 복사되었습니다!');
        }).catch(() => {
            showToast('링크 복사에 실패했습니다.');
        });
    }

    function openRandomPost() {
        if (!allPosts || allPosts.length === 0) return;
        const randomIndex = Math.floor(Math.random() * allPosts.length);
        const randomPost = allPosts[randomIndex];
        openDetail(randomPost.id);
        showToast(`🎲 '${randomPost.title}' 추천!`);
    }

    function handleSearchInput() {
        const query = document.getElementById('search-input').value;
        document.getElementById('search-clear-btn').style.display = query ? 'block' : 'none';
        applyFilters();
    }

    function clearSearch() {
        const input = document.getElementById('search-input');
        input.value = '';
        document.getElementById('search-clear-btn').style.display = 'none';
        applyFilters();
        input.focus();
    }

    function loadData() {
        const requestUrl = SHEET_BASE_URL + "&_t=" + new Date().getTime();

        Papa.parse(requestUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allPosts = results.data.filter(row => row.title && row.title.trim() !== "");
                document.getElementById('total-badge').innerText = `${allPosts.length} POSTS`;
                setupTags();
                applyFilters();

                // URL 해시(#id) 검사 후 바로 열기
                const hash = window.location.hash.replace('#', '').trim();
                if (hash) {
                    openDetail(hash);
                } else if (currentSelectedId) {
                    openDetail(currentSelectedId);
                }
            },
            error: function(err) {
                document.getElementById('post-list').innerText = "데이터를 불러오지 못했습니다. 시트 설정을 확인하세요.";
            }
        });
    }

    function forceReloadData() {
        const btn = document.getElementById('refresh-btn');
        btn.classList.add('rotating');
        loadData();
        setTimeout(() => {
            btn.classList.remove('rotating');
        }, 600);
    }

    // 태그별 게시물 개수 계산 및 생성
    function setupTags() {
        const tagCountMap = { 'ALL': allPosts.length };
        allPosts.forEach(p => {
            if (p.tag && p.tag.trim()) {
                const t = p.tag.trim();
                tagCountMap[t] = (tagCountMap[t] || 0) + 1;
            }
        });

        const tags = Object.keys(tagCountMap);
        const filterContainer = document.getElementById('tag-filters');
        filterContainer.innerHTML = tags.map(tag => `
            <button class="tag-filter-btn ${tag === selectedTag ? 'active' : ''}" onclick="filterByTag('${tag}')">
                <span>${tag === 'ALL' ? '전체' : tag}</span>
                <span class="tag-count">${tagCountMap[tag]}</span>
            </button>
        `).join('');
    }

    function filterByTag(tag) {
        selectedTag = tag;
        setupTags();
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const sortType = document.getElementById('sort-select').value;

        let filtered = allPosts.filter(post => {
            const matchesQuery = (post.title && post.title.toLowerCase().includes(query)) ||
                                 (post.tag && post.tag.toLowerCase().includes(query)) ||
                                 (post.content && post.content.toLowerCase().includes(query)) ||
                                 (post.series && post.series.toLowerCase().includes(query)) ||
                                 (post.date && post.date.toLowerCase().includes(query));
            const matchesTag = selectedTag === 'ALL' || (post.tag && post.tag.trim() === selectedTag);
            return matchesQuery && matchesTag;
        });

        if (sortType === 'latest') {
            filtered.reverse();
        } else if (sortType === 'rating-desc') {
            filtered.sort((a, b) => (parseInt(b.rating, 10) || 0) - (parseInt(a.rating, 10) || 0));
        } else if (sortType === 'rating-asc') {
            filtered.sort((a, b) => (parseInt(a.rating, 10) || 0) - (parseInt(b.rating, 10) || 0));
        }

        renderList(filtered);
    }

    function renderList(posts) {
        const container = document.getElementById('post-list');
        if (!posts || posts.length === 0) {
            container.innerHTML = "<p style='color: var(--text-sub); text-align: center; padding: 20px;'>게시물이 없습니다.</p>";
            return;
        }

        container.innerHTML = posts.map((post, idx) => `
            <div class="list-item ${String(post.id).trim() === String(currentSelectedId).trim() ? 'active' : ''}" 
                 data-id="${post.id}" 
                 style="animation-delay: ${Math.min(idx * 0.02, 0.2)}s;"
                 onclick="openDetail('${post.id}')">
                <div class="item-row">
                    <span class="item-title">${post.title}</span>
                    <div class="item-badges">
                        ${post.series && post.series.trim() ? '<span class="series-badge">📚 시리즈</span>' : ''}
                        <span class="item-tag">${post.tag ? post.tag.trim() : '기타'}</span>
                    </div>
                </div>
                <div class="item-row">
                    <span class="item-stars">${renderStars(post.rating)}</span>
                    <span class="item-date">${post.date ? post.date.trim() : ''}</span>
                </div>
            </div>
        `).join('');
    }

    function renderMedia(rawUrlString) {
        const container = document.getElementById('d-media-container');
        if (!rawUrlString || !rawUrlString.trim()) {
            container.style.display = 'none';
            container.innerHTML = '';
            return;
        }

        const items = rawUrlString.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        let youtubeHtml = '';
        let imageCardsHtml = '';

        items.forEach(item => {
            if (item.includes('youtube.com/watch?v=') || item.includes('youtu.be/')) {
                let videoId = '';
                if (item.includes('youtu.be/')) {
                    videoId = item.split('youtu.be/')[1].split('?')[0];
                } else {
                    videoId = new URL(item).searchParams.get('v');
                }
                youtubeHtml += `
                    <div class="youtube-box">
                        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                    </div>
                `;
            } else {
                let imgSrc = item;
                let targetUrl = '';

                if (item.includes('>')) {
                    const parts = item.split('>');
                    imgSrc = parts[0].trim();
                    targetUrl = parts[1].trim();
                }

                if (targetUrl) {
                    imageCardsHtml += `
                        <a class="image-card has-link" href="${targetUrl}" target="_blank" rel="noopener noreferrer">
                            <span class="link-badge">🔗 열기</span>
                            <img src="${imgSrc}" alt="이미지 링크" loading="lazy">
                        </a>
                    `;
                } else {
                    imageCardsHtml += `
                        <div class="image-card">
                            <img src="${imgSrc}" alt="이미지" loading="lazy">
                        </div>
                    `;
                }
            }
        });

        let totalHtml = youtubeHtml;
        if (imageCardsHtml) {
            totalHtml += `<div class="media-grid">${imageCardsHtml}</div>`;
        }

        if (totalHtml) {
            container.innerHTML = totalHtml;
            container.style.display = 'flex';
        } else {
            container.style.display = 'none';
            container.innerHTML = '';
        }
    }

    function renderSeriesSection(currentPost) {
        const section = document.getElementById('d-series-section');
        const list = document.getElementById('d-series-list');
        const titleElem = document.getElementById('d-series-title');

        if (!currentPost.series || !currentPost.series.trim()) {
            section.style.display = 'none';
            list.innerHTML = '';
            return;
        }

        const seriesName = currentPost.series.trim();
        const relatedPosts = allPosts.filter(p => p.series && p.series.trim() === seriesName);

        if (relatedPosts.length <= 1) {
            section.style.display = 'none';
            return;
        }

        titleElem.innerText = `${seriesName} 시리즈 (${relatedPosts.length}개 작품)`;
        list.innerHTML = relatedPosts.map(p => {
            const isCurrent = String(p.id).trim() === String(currentPost.id).trim();
            return `
                <button class="series-item-btn ${isCurrent ? 'current' : ''}" 
                        onclick="${isCurrent ? '' : `openDetail('${p.id}')`}">
                    <span>${p.title}</span>
                    <span style="font-size: 11px; opacity: 0.85;">${renderStars(p.rating)}</span>
                </button>
            `;
        }).join('');

        section.style.display = 'block';
    }

    function openDetail(id) {
        currentSelectedId = id;
        const post = allPosts.find(p => String(p.id).trim() === String(id).trim());
        if (!post) return;

        // URL 해시 업데이트 (#1)
        history.replaceState(null, null, '#' + id);

        document.getElementById('main-container').classList.remove('single-mode');
        document.getElementById('detail-pane').style.display = 'block';

        const animWrap = document.getElementById('detail-anim-wrap');
        animWrap.style.animation = 'none';
        animWrap.offsetHeight;
        animWrap.style.animation = 'postFadeSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        document.querySelectorAll('.list-item').forEach(el => {
            if (el.getAttribute('data-id') === String(id)) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });

        document.getElementById('d-title').innerText = post.title;
        document.getElementById('d-stars').innerText = renderStars(post.rating);
        document.getElementById('d-tag').innerText = post.tag ? post.tag.trim() : '기타';
        document.getElementById('d-date').innerText = post.date ? post.date.trim() : '';
        
        document.getElementById('d-content').innerHTML = marked.parse(post.content || '');
        renderMedia(post.image_url);
        renderSeriesSection(post);
    }

    function closeDetail() {
        currentSelectedId = null;
        history.replaceState(null, null, window.location.pathname);
        document.getElementById('main-container').classList.add('single-mode');
        document.getElementById('detail-pane').style.display = 'none';
        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
    }

    // 초기화 실행
    initTheme();
    initShapesEffect();
    loadData();
</script>

</body>
</html>
